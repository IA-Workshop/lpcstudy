[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers -p pytester
markers =
    unit: pure CPU test under 5 s, no I/O beyond tmp_path (DEVELOPMENT_WORKFLOW.md 4.1)
    integration: CPU smoke-preset or CLI plumbing check, under 900 s (4.1)
    slow: CPU coverage, size or convergence simulation, run only by the owner of the statistic (4.1)
    gpu: test that needs the GPU, run under the GPU lock only (4.1, 4.5)
